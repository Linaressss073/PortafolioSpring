spring.application.name=selene

# ===============================
# = DATA SOURCE (Postgres remoto - Render)
# ===============================
# El password NO va aqui: se lee de la variable de entorno DB_PASSWORD.
# Config del run: IntelliJ -> Run/Debug Configurations -> Environment variables -> DB_PASSWORD=...
spring.datasource.url=jdbc:postgresql://dpg-da385qibkg8c73fujdag-a.oregon-postgres.render.com/instanciadeejemplo?sslmode=require
spring.datasource.username=${DB_USERNAME:instanciadeejemplo_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = JWT
# ===============================
# Secret de dev; en prod debe venir de variable de entorno (nunca en el repo).
jwt.secret=${JWT_SECRET:selene-dev-secret-cambiar-en-produccion-min-32-chars}
jwt.expiration-ms=3600000

# ===============================
# = HEALTH CHECK
# ===============================
# Sirve para probar el micro si subio correctamente: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Fuerza 200 aunque algun componente (ej. DB) reporte DOWN. Ojo: esto le quita
# a un orquestador (k8s, load balancer) la señal de status code para detectar
# caidas reales; si en algun momento quieres que un readiness probe reinicie
# el pod cuando la DB se cae, hay que sacar este mapping.
management.endpoint.health.status.http-mapping.down=200
management.endpoint.health.status.http-mapping.out-of-service=200
