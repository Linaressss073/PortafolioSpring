spring.application.name=selene

# ===============================
# = DATA SOURCE (Postgres remoto - Render)
# ===============================
# El password NO va aqui: se lee de la variable de entorno DB_PASSWORD.
# Config del run: IntelliJ -> Run/Debug Configurations -> Environment variables -> DB_PASSWORD=...
spring.datasource.url=jdbc:postgresql://dpg-da385qibkg8c73fujdag-a.oregon-postgres.render.com/instanciadeejemplo?sslmode=require
spring.datasource.username=${DB_USERNAME:instanciadeejemplo_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = JWT
# ===============================
# Secret de dev; en prod debe venir de variable de entorno (nunca en el repo).
jwt.secret=${JWT_SECRET:selene-dev-secret-cambiar-en-produccion-min-32-chars}
jwt.expiration-ms=3600000
